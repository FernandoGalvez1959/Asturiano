<head>

<title>Asturianu Básico A1</title>
<style>
:root{
  --blue:#123C6B; --blue2:#1D5A9E; --gold:#E2A82B; --green:#2F6B4F; --greenbg:#E1F1E8;
  --red:#A63A2B; --redbg:#FBE4DF; --bg:#F1F5F8; --card:#FFFFFF; --ink:#1B2733; --mute:#52606D; --line:#CBD5DE;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0}
header.top{background:var(--blue);color:#fff;padding:22px 16px 20px;margin:0 -16px 20px}
header.top .in{max-width:640px;margin:0 auto;display:flex;gap:16px;align-items:center}
header.top svg{width:56px;height:56px;flex:none}
header.top h1{font-size:30px}
header.top p{margin:4px 0 0;color:#D6E3F2;font-size:17px}
.bar{height:12px;background:#0B2A4C;border-radius:8px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:8px}
.lesson-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);
  border-radius:16px;padding:14px 16px;margin:0 0 12px;font:inherit;color:inherit;min-height:76px;cursor:pointer}
.lesson-card:focus-visible,.btn:focus-visible,.opt:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.lesson-card .n{flex:none;width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font:700 22px Georgia,serif}
.lesson-card.done .n{background:var(--green)}
.lesson-card .t{font:700 21px/1.25 Georgia,serif}
.lesson-card .s{font-size:16px;color:var(--mute);margin-top:2px}
.lesson-card.done{border-color:var(--green)}
.btn{display:block;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--blue2);color:#fff;font:600 20px system-ui,sans-serif;padding:12px 18px;margin:12px 0;cursor:pointer;text-align:center}
.btn.alt{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.btn.gold{background:var(--gold);color:#241a00}
.btn.small{min-height:44px;font-size:16px;font-weight:500;background:transparent;color:var(--mute);border:1px solid var(--line)}
.back{background:none;border:0;color:var(--blue2);font:600 18px system-ui,sans-serif;padding:14px 0;cursor:pointer;min-height:48px}
h2.lt{font-size:28px;margin:4px 0 6px}
.intro{margin:0 0 8px}
h3{font-size:22px;margin:28px 0 10px;color:var(--blue)}
.vocab{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:4px 16px}
.vocab .r{padding:12px 0;border-bottom:1px solid #E3E9EE}
.vocab .r:last-child{border-bottom:0}
.vocab .a{font:700 23px/1.25 Georgia,serif;color:var(--blue)}
.vocab .e{font-size:17px;color:var(--mute)}
table.t{width:100%;border-collapse:collapse;background:var(--card);border:2px solid var(--line);border-radius:12px;overflow:hidden;margin:10px 0}
table.t caption{text-align:left;font:700 20px Georgia,serif;padding:4px 0 8px;color:var(--ink)}
table.t td{padding:10px 14px;border-top:1px solid #E3E9EE;font-size:20px}
table.t td:last-child{font-weight:700;color:var(--blue)}
.ex{background:var(--card);border-left:6px solid var(--gold);border-radius:6px;padding:10px 14px;margin:0 0 10px}
.ex b{font:700 21px Georgia,serif;color:var(--blue);display:block}
.ex span{color:var(--mute);font-size:17px}
ul.tips{margin:0;padding-left:22px}
ul.tips li{margin:0 0 10px}
.note{background:#FFF6DD;border:2px solid #F0D58A;border-radius:14px;padding:12px 16px;margin-top:14px}
.qhead{display:flex;justify-content:space-between;color:var(--mute);font-size:17px;margin:6px 0 12px}
.q{font:700 25px/1.3 Georgia,serif;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;min-height:60px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin:0 0 12px;font:600 22px system-ui,sans-serif;color:var(--ink);cursor:pointer}
.opt.ok{background:var(--greenbg);border-color:var(--green)}
.opt.bad{background:var(--redbg);border-color:var(--red)}
.opt[disabled]{cursor:default}
.fb{border-radius:14px;padding:12px 16px;margin:6px 0;font-size:19px}
.fb.ok{background:var(--greenbg);color:#173D2B}
.fb.bad{background:var(--redbg);color:#5A1E15}
.score{font:700 54px Georgia,serif;color:var(--blue);text-align:center;margin:20px 0 4px}
.center{text-align:center}
.foot{margin-top:28px}
</style>
</head>

 tips:["Delante de vocal, “la” y “el” se acortan: l’agua, l’azucre.","El asturiano mantiene la f- latina en palabras como fame (hambre).","Cultura: la sidra se escancia, echándola desde arriba para que gane burbuja. Lo que se sirve cada vez es un culín."],
 ex:[
  ["“Leche” se dice…","Lleche","Leche","Llechi","Lleite","Empieza por ll-: lleche."],

  ["“Manzana” se dice…","Mazana","Manzana","Mazanu","Manzaña","Mazana, sin n."],
  ["“Tengo hambre” se dice…","Tengo fame","Tengo hambre","Tengo fami","Tengo fome","Fame mantiene la f-."],

 tips:["Terminaciones: -o, -es, -e, -amos/-emos/-imos, -áis/-éis/-ís, -en.","En la forma de vós llevan tilde: faláis, coméis, vivís.","El verbo falar es el “hablar”. Por eso al asturiano también se le llama “la fala”."],

/* ---------- Utilidades ---------- */
var app = document.getElementById("app");
var KEY = "asturiano-a1-progreso";
var prog = {};
try { prog = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { prog = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch(e) {} }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
var CROSS = '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon fill="#E2A82B" points="38,4 62,4 55,24 55,76 62,96 38,96 45,76 45,24"/><polygon fill="#E2A82B" points="4,38 4,62 24,55 76,55 96,62 96,38 76,45 24,45"/></svg>';
function mastered(i){ var p = prog[i]; return p && p.best / p.total >= 0.8; }

/* ---------- Pantallas ---------- */
function home(){
  var done = 0; L.forEach(function(_,i){ if (mastered(i)) done++; });
  var h = '<header class="top"><div class="in">' + CROSS + '<div><h1>Asturianu Básico A1</h1><p>8 lecciones para empezar desde cero</p></div></div>' +
    '<div class="in"><div class="bar" style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="8" aria-valuenow="' + done + '"><i style="width:' + (done/8*100) + '%"></i></div></div>' +
    '<div class="in"><p>' + done + ' de 8 lecciones dominadas</p></div></header>';
  L.forEach(function(l,i){
    var p = prog[i];
    var st = p ? (mastered(i) ? "Dominada · " : "A repasar · ") + p.best + " de " + p.total : l.s;
    h += '<button class="lesson-card' + (mastered(i) ? ' done' : '') + '" data-go="#/l/' + i + '"><span class="n">' + (mastered(i) ? '✓' : (i+1)) + '</span><span><div class="t">' + esc(l.t) + '</div><div class="s">' + esc(st) + '</div></span></button>';
  });
  h += '<button class="btn gold" data-go="#/r">Repaso general (15 preguntas)</button>';
  h += '<div class="foot center"><button class="btn small" id="reset">Borrar mi progreso</button></div>';
  app.innerHTML = h;
  var r = document.getElementById("reset");
  if (r) r.onclick = function(){ if (confirm("¿Borrar todo tu progreso?")) { prog = {}; save(); home(); } };
}

function lesson(i){
  var l = L[i], h = '<button class="back" data-go="#/">‹ Todas las lecciones</button>';
  h += '<h2 class="lt">' + (i+1) + '. ' + esc(l.t) + '</h2><p class="intro">' + esc(l.intro) + '</p>';
  if (l.vocab){
    h += '<h3>Vocabulario</h3><div class="vocab">';
    l.vocab.forEach(function(v){ h += '<div class="r"><div class="a">' + esc(v[0]) + '</div><div class="e">' + esc(v[1]) + '</div></div>'; });
    h += '</div>';
  }
  if (l.tables){
    l.tables.forEach(function(t){
      h += '<table class="t"><caption>' + esc(t.c) + '</caption>';
      t.r.forEach(function(r){ h += '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; });
      h += '</table>';
    });
  }
  if (l.ej){
    h += '<h3>Ejemplos</h3>';
    l.ej.forEach(function(e){ h += '<div class="ex"><b>' + esc(e[0]) + '</b><span>' + esc(e[1]) + '</span></div>'; });
  }
  if (l.tips){
    h += '<h3>Para fijarlo</h3><div class="note"><ul class="tips">';
    l.tips.forEach(function(t){ h += '<li>' + esc(t) + '</li>'; });
    h += '</ul></div>';
  }
  h += '<button class="btn" data-go="#/q/' + i + '">Hacer los ejercicios</button>';
  app.innerHTML = h;
  window.scrollTo(0,0);
}

var Q = null;
function startQuiz(list, title, idx){
  Q = { title:title, idx:idx, i:0, score:0, answered:false,
    list: list.map(function(e){
      var opts = shuffle([e[1], e[2], e[3], e[4]]);
      return { q:e[0], opts:opts, ok:e[1], why:e[5] };
    }) };
  quiz();
}
function quiz(){
  var q = Q.list[Q.i], n = Q.list.length;
  var back = Q.idx === null ? "#/" : "#/l/" + Q.idx;
  var h = '<button class="back" data-go="' + back + '">‹ Salir</button>';
  h += '<div class="qhead"><span>' + esc(Q.title) + '</span><span>Pregunta ' + (Q.i+1) + ' de ' + n + '</span></div>';
  h += '<p class="q">' + esc(q.q) + '</p><div id="opts">';
  q.opts.forEach(function(o,k){ h += '<button class="opt" data-k="' + k + '">' + esc(o) + '</button>'; });
  h += '</div><div id="fb"></div>';
  app.innerHTML = h;
  window.scrollTo(0,0);
  Array.prototype.forEach.call(document.querySelectorAll(".opt"), function(b){
    b.onclick = function(){ answer(parseInt(b.getAttribute("data-k"),10)); };
  });
}
function answer(k){
  if (Q.answered) return;
  Q.answered = true;
  var q = Q.list[Q.i], right = q.opts[k] === q.ok;
  if (right) Q.score++;
  Array.prototype.forEach.call(document.querySelectorAll(".opt"), function(b,j){
    b.disabled = true;
    if (q.opts[j] === q.ok) b.className += " ok";
    else if (j === k) b.className += " bad";
  });
  var last = Q.i === Q.list.length - 1;
  document.getElementById("fb").innerHTML =
    '<div class="fb ' + (right ? 'ok' : 'bad') + '"><b>' + (right ? '¡Correcto!' : 'Era: ' + esc(q.ok)) + '</b><br>' + esc(q.why) + '</div>' +
    '<button class="btn" id="next">' + (last ? 'Ver resultado' : 'Siguiente') + '</button>';
  document.getElementById("next").onclick = function(){
    Q.answered = false;
    if (last) result(); else { Q.i++; quiz(); }
  };
  document.getElementById("next").focus();
}
function result(){
  var n = Q.list.length, s = Q.score, good = s / n >= 0.8;
  if (Q.idx !== null){
    var p = prog[Q.idx] || { best:0, total:n };
    if (s >= p.best) { p.best = s; p.total = n; }
    prog[Q.idx] = p; save();
  }
  var h = '<div class="score">' + s + ' / ' + n + '</div>';
  h += '<p class="center">' + (good ? '¡Muy bien! Esta parte ya la dominas.' : 'Casi. Repasa la lección y vuelve a intentarlo: con 5 aciertos la das por dominada.') + '</p>';
  if (Q.idx !== null){
    h += '<button class="btn alt" data-go="#/l/' + Q.idx + '">Repasar la lección</button>';
    h += '<button class="btn alt" id="again">Repetir ejercicios</button>';
    if (good && Q.idx < L.length - 1) h += '<button class="btn" data-go="#/l/' + (Q.idx+1) + '">Siguiente lección</button>';
    else if (good) h += '<button class="btn gold" data-go="#/r">Hacer el repaso general</button>';
    h += '<button class="btn small" data-go="#/">Ir al inicio</button>';
  } else {
    h += '<button class="btn" id="again">Otro repaso</button><button class="btn small" data-go="#/">Ir al inicio</button>';
  }
  app.innerHTML = h;
  window.scrollTo(0,0);
  var a = document.getElementById("again");
  if (a) a.onclick = function(){ route(); };
}

/* ---------- Rutas ---------- */
function route(){
  var h = location.hash || "#/", m;
  if (m = h.match(/^#\/l\/(\d+)$/)) { var i = +m[1]; if (L[i]) return lesson(i); }
  if (m = h.match(/^#\/q\/(\d+)$/)) { var j = +m[1]; if (L[j]) return startQuiz(L[j].ex, "Lección " + (j+1), j); }
  if (h === "#/r") {
    var all = []; L.forEach(function(l){ all = all.concat(l.ex); });
    return startQuiz(shuffle(all).slice(0,15), "Repaso general", null);
  }
  home();
}
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-go]");
  if (t) { var g = t.getAttribute("data-go"); if (location.hash === g) route(); else location.hash = g; }
});
window.addEventListener("hashchange", route);
route();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
